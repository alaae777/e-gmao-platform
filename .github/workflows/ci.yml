name: CI - e-GMAO

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:

  backend:
    name: Backend - Django
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: egmao
          POSTGRES_USER: egmao
          POSTGRES_PASSWORD: egmao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U egmao -d egmao"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        working-directory: egmao_backend/backend/egmao_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier Django
        working-directory: egmao_backend/backend/egmao_backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: egmao
          POSTGRES_USER: egmao
          POSTGRES_PASSWORD: egmao
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py check

      - name: Appliquer les migrations
        working-directory: egmao_backend/backend/egmao_backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: egmao
          POSTGRES_USER: egmao
          POSTGRES_PASSWORD: egmao
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py migrate

      - name: Lancer les tests
        working-directory: egmao_backend/backend/egmao_backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: egmao
          POSTGRES_USER: egmao
          POSTGRES_PASSWORD: egmao
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          python manage.py test


  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: egmao_frontend/frontend/egmao_frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: egmao_frontend/frontend/egmao_frontend
        run: |
          npm ci

      - name: Vérifier le build
        working-directory: egmao_frontend/frontend/egmao_frontend
        run: |
          npm run build
